function render(){
 LC.clearLayers();LZ.clearLayers();const cnt={};
 S.z.forEach(z=>{const a=age(z),ag=a===null?999:a,op=Math.max(.05,.5-ag*.0075);
  L.polygon(z.pts,{color:PC[z.pot]||'#1d3557',weight:3,fillColor:PC[z.pot]||'#1d3557',fillOpacity:op,opacity:Math.max(.35,op+.2),dashArray:ag>45?'6 6':null,interactive:!mode})
   .bindPopup(()=>popZ(z)).bindTooltip((ST[z.pot]||'')+z.n,{permanent:true,direction:'center',className:'zl'}).addTo(LZ)});
 S.r.forEach(r=>L.polyline(r.pts,{color:'#d6249f',weight:5,opacity:.9,dashArray:'10 7',interactive:!mode}).bindTooltip(r.n,{sticky:true}).bindPopup(()=>popR(r)).addTo(LZ));
 CLI.forEach(c=>{if(c.lat==null||!marked(c))return;const r=calc(c);cnt[r.k]=(cnt[r.k]||0)+1;if(hid.has(r.k))return;
  if(c.poly&&c.poly.length>2)L.polygon(c.poly,{color:'#fff',weight:1.5,fillColor:COL[r.k],fillOpacity:.95,interactive:!mode}).on('click',e=>{L.DomEvent.stopPropagation(e);tellClient(c)}).addTo(LC);
  if(c.poly&&c.poly.length>2&&map.getZoom()>=18)return;
  const lab=r.k==='verde'?'✓':r.k==='gris'?'':r.k==='morado'?'?':r.cuota;
  L.marker([c.lat,c.lng],{icon:L.divIcon({className:'',html:`<div class="pin ${r.k}" style="background:${COL[r.k]}">${lab}</div>`,iconSize:[32,32],iconAnchor:[16,16]})})
   .on('click',e=>{L.DomEvent.stopPropagation(e);tellClient(c)}).addTo(LC)});
 $('leg').innerHTML=Object.keys(COL).map(k=>`<div class="ch ${hid.has(k)?'off':''}" onclick="tg('${k}')"><i style="background:${COL[k]}"></i>${NAME[k]} ${cnt[k]||0}</div>`).join('')}
function tg(k){hid.has(k)?hid.delete(k):hid.add(k);render()}

const sh=h=>{$('sheet').innerHTML=h;$('sheet').hidden=false};
function cerrar(){$('sheet').hidden=true;mode=null;pts=[];LT.clearLayers();render()}

function popC(c){const r=calc(c);let s=`<b>${esc(c.n)||'Sin nombre'}</b><br>`;
 if(r.k==='gris')s+='No salió / no es cliente';else if(r.k==='morado')s+='Dudoso: dijo "soy cliente, pero por ahora no"';
 else if(r.k==='verde')s+=`Cancelado (${c.tot} cuotas pagas)`;
 else s+=`Cuota ${r.cuota}/${c.tot} · vence ${fd(r.nx)} `+(r.d>0?`<br><b style="color:#d93a3a">Atrasado ${r.d} días</b>`:r.d===0?'(hoy)':`(en ${-r.d} días)`);
 if(c.tel)s+=`<br><a href="tel:${esc(c.tel)}">${esc(c.tel)}</a>`;
 if(c.nota)s+=`<br>${esc(c.nota)}`;
 return s+`<div class="pb">${['gris','verde','morado'].includes(r.k)?'':`<button onclick="pay('${c.id}')">Pagó cuota</button>`}<button onclick="editC('${c.id}')">Editar</button><a href="https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lng}" target="_blank">Ir</a><button class="x" onclick="delC('${c.id}')">Borrar</button></div>`}
function popZ(z){const a=age(z);return `<b>${esc(z.n)}</b><br>Último paso: ${hace(a)} · ${z.p.length} pasadas<div class="pb"><button onclick="paso('${z.id}')">Pasé hoy</button><select onchange="diaZ('${z.id}',this.value)">${DIAS.map((d,i)=>`<option value="${i}"${z.dia===''+i?' selected':''}>${i?d:'Sin día'}</option>`).join('')}</select><select onchange="potZ('${z.id}',this.value)">${[['','Potencial'],['F','Fuerte'],['M','Media'],['D','Difícil']].map(o=>`<option value="${o[0]}"${(z.pot||'')===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select><button class="x" onclick="delZ('${z.id}')">Borrar</button></div>`}

function pay(id){const c=S.c.find(x=>x.id===id);c.pag=Math.min(c.tot,c.pag+1);save();map.closePopup();render()}
function editC(id){map.closePopup();formC(S.c.find(x=>x.id===id))}
function delC(id){if(confirm('¿Borrar este cliente?')){S.c=S.c.filter(x=>x.id!==id);save();map.closePopup();render()}}
function paso(id){const z=S.z.find(x=>x.id===id),h=iso(hoy());if(lastP(z)!==h)z.p.push(h);save();map.closePopup();render()}
function potZ(id,v){S.z.find(x=>x.id===id).pot=v;save();map.closePopup();render()}
function diaZ(id,v){S.z.find(x=>x.id===id).dia=v;save()}
function delZ(id){if(confirm('¿Borrar esta zona?')){S.z=S.z.filter(x=>x.id!==id);save();map.closePopup();render()}}

function formC(c){cur=c;sh(`<b>${c.id?'Editar':'Nuevo'} cliente</b>
<label>Nombre</label><input id="fn" value="${esc(c.n)}">
<label>Teléfono</label><input id="ft" type="tel" value="${esc(c.tel)}">
<label>Dirección o carril</label><input id="fo" value="${esc(c.nota)}">
<label>Estado</label><select id="fe"><option value="c">Cliente con cuotas</option><option value="no"${c.t==='no'?' selected':''}>No salió / no es cliente</option><option value="dud"${c.t==='dud'?' selected':''}>Dudoso: soy cliente, pero por ahora no</option></select>
<label>Cuotas totales</label><input id="fa" type="number" min="1" value="${c.tot||6}">
<label>Cuotas ya pagadas</label><input id="fp" type="number" min="0" value="${c.pag||0}">
<label>Fecha de la primera cuota (la elige el cliente)</label><input id="fv" type="date" value="${c.v1||iso(addM(iso(hoy()),1))}">
<div class="pb"><button onclick="saveC()">Guardar</button><button class="x" onclick="cerrar()">Cancelar</button></div>`)}
function saveC(){const c=cur;c.n=$('fn').value.trim();c.tel=$('ft').value.trim();c.nota=$('fo').value.trim();c.t=$('fe').value;c.tot=Math.max(1,+$('fa').value||1);c.pag=Math.max(0,+$('fp').value||0);c.v1=$('fv').value||iso(addM(iso(hoy()),1));
 if(!c.id){if(!dept(c)&&!confirm('Este punto está FUERA de tu zona (San Martín, Junín y Rivadavia). ¿Guardarlo igual?'))return;c.id=Date.now().toString(36);c.vta=iso(hoy());S.c.push(c)}save();cerrar()}
function formZ(){sh(`<b>Nueva zona</b><label>Nombre (distrito, carril, barrio)</label><input id="zn" list="dl"><datalist id="dl">${NZ.map(n=>`<option value="${n}">`).join('')}</datalist>
<label>Día de visita</label><select id="zd">${DIAS.map((d,i)=>`<option value="${i}">${i?d:'Sin día'}</option>`).join('')}</select>
<label>Potencial de venta</label><select id="zp"><option value="">Sin definir</option><option value="F">Fuerte (se vende bien)</option><option value="M">Media</option><option value="D">Difícil (cuesta más)</option></select>
<label><input id="zh" type="checkbox" checked style="width:auto;min-height:0"> Pasé hoy por esta zona</label>
<div class="pb"><button onclick="saveZ()">Guardar</button><button class="x" onclick="cerrar()">Cancelar</button></div>`)}
function saveZ(){S.z.push({id:Date.now().toString(36),n:$('zn').value.trim()||'Zona',pts:pts.slice(),p:$('zh').checked?[iso(hoy())]:[],dia:$('zd').value,pot:$('zp').value});save();cerrar()}

function gps(ok){navigator.geolocation?navigator.geolocation.getCurrentPosition(q=>{const p={lat:q.coords.latitude,lng:q.coords.longitude};pos=p;if(me)me.remove();me=L.circleMarker([p.lat,p.lng],{radius:8,color:'#fff',weight:3,fillColor:'#1a73e8',fillOpacity:1}).addTo(map);ok(p)},()=>alert('No pude obtener tu ubicación. Revisá el permiso de ubicación del navegador.'),{enableHighAccuracy:true,timeout:15000}):alert('Este navegador no tiene ubicación')}

async function buildingAt(lat,lng){
 if(!HSRC)return null;
 const z=HMAX,n=2**z,r=Math.PI/180,x=Math.floor((lng+180)/360*n),y=Math.floor((1-Math.log(Math.tan(lat*r)+1/Math.cos(lat*r))/Math.PI)/2*n);
 let m;try{m=await HSRC.get({z,x,y},256)}catch(e){return null}
 const toLL=q=>{const X=(x+q.x/256)/n,Y=(y+q.y/256)/n;return[Math.atan(Math.sinh(Math.PI*(1-2*Y)))/r,X*360-180]};
 let best=null;
 for(const[name,fs]of m){if(HNAMES.length?!HNAMES.includes(name):!/build/i.test(name))continue;
  for(const f of fs){if(f.geomType!==3)continue;
   for(const ring of f.geom){if(ring.length<4)continue;
    const pts=ring.map(toLL),area=Math.abs(ring.reduce((a,q,i)=>{const w=ring[(i+1)%ring.length];return a+q.x*w.y-w.x*q.y},0))/2;
    const cen={lat:pts.reduce((a,q)=>a+q[0],0)/pts.length,lng:pts.reduce((a,q)=>a+q[1],0)/pts.length};
    const d=inZ({lat,lng},{pts})?0:dist({lat,lng},cen);
    if(d<=25&&(!best||d<best.d||(d===best.d&&area<best.a)))best={d,a:area,poly:pts,c:cen}}}}
 if(!best)return null;
 let poly=best.poly;if(poly.length>13){const k=Math.ceil(poly.length/12);poly=poly.filter((q,i)=>i%k===0)}
 return{poly,c:best.c}}

async function toggleH(){

 if(HB)return;
 if(!HL){HB=1;hmsg('Cargando casas…');
  const ERR=[];for(const u of HU){try{
   const src=new protomapsL.PmtilesSource(u,false),h=await src.p.getHeader();HSRC=src;HMAX=h.maxZoom;let md={};try{md=await src.p.getMetadata()}catch(e){}
   const all=((md&&md.vector_layers)||[]).map(x=>x.id);let names=all.filter(n=>/build/i.test(n));if(!names.length)names=all.length?all:['building','buildings'];HNAMES=names;
   HL=protomapsL.leafletLayer({url:u,maxDataZoom:h.maxZoom,zIndex:5,attribution:'Casas: Overture Maps (Microsoft, Google y OSM)',paintRules:names.map(n=>({dataLayer:n,symbolizer:new protomapsL.PolygonSymbolizer({fill:'#ff6a00',opacity:.9,stroke:'#7a2d00',width:.8})})),labelRules:[]});
   break}catch(e){HL=null;ERR.push((e&&e.message)||String(e))}}
  HB=0;if(!HL)return hmsg('No pude cargar las casas ('+ERR.slice(0,2).join(' · ').slice(0,110)+'). Probá de nuevo; si sigue igual, mandame una captura de este aviso.')}
